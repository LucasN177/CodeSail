<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CodeSail</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="CodeSail.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-title" content="CodeSail" />
    <!-- iOS rundet die Ecken selbst ab, daher die Variante ohne runde Ecken -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Startbildschirm: wird von Blazor ersetzt, sobald die App geladen ist -->
        <div class="splash" role="status" aria-live="polite">
            <div class="splash-center">
                <img class="splash-logo" src="icon.svg" alt="" width="112" height="112" />
                <h1 class="splash-title">CodeSail</h1>
                <p class="splash-tagline">Code-Editor für das iPad</p>
                <div class="splash-progress" aria-hidden="true"><div class="splash-progress-bar"></div></div>
                <p class="splash-percent"></p>
            </div>
            <p class="splash-author">by Lucas Nagelsmann</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ein unerwarteter Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
